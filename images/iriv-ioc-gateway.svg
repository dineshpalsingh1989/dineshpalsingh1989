<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="1200" height="720" role="img" aria-labelledby="t d">
  <title id="t">Meet IOC, the LAN gateway</title>
  <desc id="d">Cartoon: the IRIV IO Controller reads switches, 4-20 mA sensors and RS485 meters, and shares them with SCADA over Modbus TCP and with an MQTT broker, while driving outputs and a buzzer.</desc>
  <defs>
    <style>
      .ink{stroke:#1d2926;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
      .thin{stroke:#1d2926;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
      .h{font-family:'Comic Sans MS','Chalkboard SE','Comic Neue',cursive;font-weight:700;fill:#1d2926}
      .b{font-family:'Segoe UI',Helvetica,Arial,sans-serif;fill:#34423c}
      .wire{fill:none;stroke-width:6;stroke-linecap:round;stroke-dasharray:2 14}
    </style>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="2" fill="#e9e2cc"/></pattern>
  </defs>

  <rect x="4" y="4" width="1192" height="712" rx="36" fill="#fbf8ef" class="ink"/>
  <rect x="4" y="4" width="1192" height="712" rx="36" fill="url(#dots)"/>

  <text x="600" y="66" text-anchor="middle" class="h" font-size="40">Meet IOC: your little LAN gateway!</text>
  <text x="600" y="100" text-anchor="middle" class="b" font-size="19">Plug sensors in on the left. Get every value on your network on the right.</text>

  <!-- wires: inputs -> IOC -> network -->
  <path class="wire" stroke="#3fae6a" d="M222 205 C 330 205, 360 395, 450 400"/>
  <path class="wire" stroke="#4d6596" d="M222 395 C 320 395, 370 430, 450 430"/>
  <path class="wire" stroke="#2f6a7d" d="M222 585 C 340 585, 370 470, 450 462"/>
  <path class="wire" stroke="#1f5f47" d="M776 400 C 860 395, 880 205, 970 205"/>
  <path class="wire" stroke="#e8833a" d="M776 430 C 850 430, 890 395, 975 395"/>
  <path class="wire" stroke="#a3562a" d="M750 462 C 850 475, 880 570, 975 575"/>

  <!-- INPUTS -->
  <g transform="translate(150 205)">
    <circle r="62" fill="#e8f2eb" class="ink"/>
    <g transform="scale(.9)">
      <rect x="-30" y="-6" width="60" height="34" rx="8" fill="#cfd8d1" class="thin"/>
      <path d="M-20 -6 v-14 a20 20 0 0 1 40 0 v14 z" fill="#e5484d" class="thin"/>
      <path d="M-10 -22 q6 -8 14 -6" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text y="92" text-anchor="middle" class="h" font-size="19">Buttons &amp; switches</text>
    <text y="115" text-anchor="middle" class="b" font-size="15">11 digital inputs · pulse counters</text>
  </g>
  <g transform="translate(150 395)">
    <circle r="62" fill="#ecf0f8" class="ink"/>
    <g transform="scale(.85)">
      <circle r="40" fill="#fff" class="thin"/>
      <path d="M-28 10 A30 30 0 0 1 28 10" fill="none" stroke="#cfd8e8" stroke-width="8"/>
      <path d="M-28 10 A30 30 0 0 1 6 -29" fill="none" stroke="#4d6596" stroke-width="8"/>
      <path d="M0 6 L18 -16" class="thin"/>
      <circle r="6" fill="#1d2926"/>
    </g>
    <text y="92" text-anchor="middle" class="h" font-size="19">4–20 mA / 0–10 V</text>
    <text y="115" text-anchor="middle" class="b" font-size="15">2 analog inputs, scaled</text>
  </g>
  <g transform="translate(150 585)">
    <rect x="-66" y="-44" width="132" height="88" rx="18" fill="#e9f1f4" class="ink"/>
    <rect x="-46" y="-28" width="92" height="34" rx="6" fill="#1d2926"/>
    <text y="-4" text-anchor="middle" font-family="Consolas,monospace" font-size="22" font-weight="700" fill="#7ee0a3">12.4</text>
    <circle cx="-24" cy="24" r="7" fill="#f4c84a" class="thin"/>
    <circle cx="0" cy="24" r="7" fill="#3fae6a" class="thin"/>
    <circle cx="24" cy="24" r="7" fill="#e8833a" class="thin"/>
    <text y="76" text-anchor="middle" class="h" font-size="19">RS485 meters</text>
    <text y="99" text-anchor="middle" class="b" font-size="15">Modbus RTU, up to 64 values</text>
  </g>

  <!-- IOC character -->
  <g transform="translate(600 430)">
    <ellipse cx="0" cy="118" rx="150" ry="14" fill="#1d2926" opacity=".12"/>
    <rect x="-120" y="98" width="240" height="18" rx="6" fill="#b8c2bc" class="thin"/>
    <rect x="-150" y="-95" width="300" height="200" rx="30" fill="#2b3134" class="ink"/>
    <g fill="#e8833a" class="thin">
      <rect x="-128" y="-122" width="36" height="34" rx="6"/><rect x="-86" y="-122" width="36" height="34" rx="6"/>
      <rect x="-44" y="-122" width="36" height="34" rx="6"/><rect x="6" y="-122" width="36" height="34" rx="6"/>
      <rect x="48" y="-122" width="36" height="34" rx="6"/><rect x="90" y="-122" width="36" height="34" rx="6"/>
    </g>
    <rect x="-112" y="-78" width="150" height="26" rx="6" fill="#fff"/>
    <text x="-37" y="-59" text-anchor="middle" font-family="Arial,sans-serif" font-style="italic" font-weight="700" font-size="15" fill="#1d2926">IRIV IO Controller</text>
    <ellipse cx="-48" cy="0" rx="26" ry="30" fill="#fff"/>
    <ellipse cx="48" cy="0" rx="26" ry="30" fill="#fff"/>
    <circle cx="-40" cy="6" r="13" fill="#1d2926"/><circle cx="56" cy="6" r="13" fill="#1d2926"/>
    <circle cx="-35" cy="0" r="4.5" fill="#fff"/><circle cx="61" cy="0" r="4.5" fill="#fff"/>
    <path d="M-30 46 Q0 74 30 46" fill="#e5484d" stroke="#fff" stroke-width="4" stroke-linejoin="round"/>
    <g><circle cx="-110" cy="82" r="5" fill="#3fae6a"/><circle cx="-94" cy="82" r="5" fill="#3fae6a"/><circle cx="-78" cy="82" r="5" fill="#4d8be8"/><circle cx="78" cy="82" r="5" fill="#e5484d"/><circle cx="94" cy="82" r="5" fill="#3fae6a"/><circle cx="110" cy="82" r="5" fill="#3fae6a"/></g>
    <rect x="150" y="-30" width="26" height="40" rx="5" fill="#cfd8d1" class="thin"/>
    <rect x="156" y="-22" width="14" height="10" fill="#3fae6a"/>
  </g>

  <!-- speech bubble -->
  <g transform="translate(600 218)">
    <path d="M-170 -52 h340 a22 22 0 0 1 22 22 v38 a22 22 0 0 1 -22 22 h-150 l-22 26 l-6 -26 h-162 a22 22 0 0 1 -22 -22 v-38 a22 22 0 0 1 22 -22 z" fill="#fff" class="ink"/>
    <text y="-15" text-anchor="middle" class="h" font-size="19">I read everything plugged into me…</text>
    <text y="12" text-anchor="middle" class="h" font-size="19">…and share it on your LAN!</text>
  </g>

  <!-- beep! -->
  <g transform="translate(822 292) rotate(-10)">
    <path d="M0 -40 L12 -14 L40 -22 L24 2 L44 22 L14 20 L4 46 L-8 20 L-38 26 L-20 2 L-40 -20 L-12 -14 Z" fill="#f4c84a" class="thin"/>
    <text y="10" text-anchor="middle" class="h" font-size="18">BEEP!</text>
  </g>

  <!-- NETWORK / OUTPUTS -->
  <g transform="translate(1050 205)">
    <rect x="-80" y="-58" width="160" height="104" rx="12" fill="#ecf5ef" class="ink"/>
    <rect x="-62" y="-40" width="124" height="68" rx="6" fill="#fff" class="thin"/>
    <rect x="-48" y="-6" width="16" height="26" fill="#3fae6a"/><rect x="-24" y="-24" width="16" height="44" fill="#4d6596"/>
    <rect x="0" y="-14" width="16" height="34" fill="#e8833a"/><rect x="24" y="-30" width="16" height="50" fill="#3fae6a"/>
    <path d="M-22 46 h44 l10 16 h-64 z" fill="#cfd8d1" class="thin"/>
    <text y="92" text-anchor="middle" class="h" font-size="19">SCADA &amp; PLC</text>
    <text y="115" text-anchor="middle" class="b" font-size="15">Modbus TCP · Cytron addresses</text>
  </g>
  <g transform="translate(1050 395)">
    <path d="M-62 30 a30 30 0 0 1 4 -58 a40 40 0 0 1 74 -12 a32 32 0 0 1 48 34 a26 26 0 0 1 -6 36 z" fill="#f8ede4" class="ink"/>
    <text y="12" text-anchor="middle" class="h" font-size="24" style="fill:#a3562a">MQTT</text>
    <text y="72" text-anchor="middle" class="h" font-size="19">MQTT broker</text>
    <text y="95" text-anchor="middle" class="b" font-size="15">a topic for every pin you choose</text>
  </g>
  <g transform="translate(1050 575)">
    <circle cx="-38" cy="-6" r="30" fill="#fff4c9" class="ink"/>
    <path d="M-48 -6 q10 -14 20 0" fill="none" class="thin"/>
    <rect x="-50" y="24" width="24" height="14" rx="3" fill="#cfd8d1" class="thin"/>
    <rect x="6" y="-32" width="66" height="56" rx="10" fill="#f3eefa" class="ink"/>
    <text x="39" y="2" text-anchor="middle" class="h" font-size="16" style="fill:#6b4fa0">DO 0–3</text>
    <text y="82" text-anchor="middle" class="h" font-size="19">Lamps, relays, buzzer</text>
    <text y="105" text-anchor="middle" class="b" font-size="15">4 outputs · remote control</text>
  </g>
</svg>
