<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="790" viewBox="0 0 1200 790" role="img" aria-labelledby="t d">
<title id="t">What I'm building</title>
<desc id="d">Six cartoon panels: the Wilcoxon 883M gateway; the Smart City Demo Dashboard with a 3D city, airport and warehouse; the Milesight Dashboard for LoRaWAN sensors with MQTT, Firebase and Telegram; the IRIV Speed Console reading speed and plates from LPR cameras; the Depth Inspection Station giving PASS or FAIL with a depth camera and Hailo AI; and the ForgeModbus Modbus TCP server library for ESP32.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#16364a"/></linearGradient>
<rect id="panel" width="360" height="290" rx="16" fill="#16283e" stroke="#35516b" stroke-width="2"/>
</defs>
<rect width="1200" height="790" rx="20" fill="url(#bg)"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="48" y="52" fill="#38bdf8" font-size="15" letter-spacing="3">PROJECTS</text>
<text x="48" y="92" fill="#f8fafc" font-size="30" font-weight="700">What I'm building</text>
<text x="48" y="120" fill="#a9c2d7" font-size="16">Industrial IoT, edge vision and the tools behind them.</text>

<!-- 1 883M gateway -->
<g transform="translate(40 140)">
<use href="#panel"/>
<rect x="20" y="20" width="80" height="22" rx="11" fill="#34d399"/><text x="60" y="36" fill="#064e3b" font-size="12" font-weight="700" text-anchor="middle">CURRENT</text>
<text x="112" y="37" fill="#f8fafc" font-size="18" font-weight="700">883M gateway</text>
<rect x="28" y="110" width="96" height="58" rx="12" fill="#64748b"/>
<g stroke="#475569" stroke-width="3"><line x1="44" y1="118" x2="44" y2="160"/><line x1="60" y1="118" x2="60" y2="160"/><line x1="76" y1="118" x2="76" y2="160"/><line x1="92" y1="118" x2="92" y2="160"/></g>
<rect x="60" y="86" width="30" height="24" rx="7" fill="#2dd4bf"/><circle cx="70" cy="96" r="3" fill="#0f172a"/><circle cx="80" cy="96" r="3" fill="#0f172a"/>
<path d="M90 98 C 130 80, 140 130, 168 128" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-dasharray="8 5"/>
<rect x="168" y="96" width="70" height="64" rx="12" fill="#2563eb"/>
<circle cx="190" cy="122" r="6" fill="#fff"/><circle cx="216" cy="122" r="6" fill="#fff"/>
<path d="M188 140 Q203 152 218 140" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
<g fill="#cbd5e1" font-size="11" font-weight="700"><rect x="258" y="74" width="84" height="24" rx="12"/><rect x="258" y="116" width="84" height="24" rx="12"/><rect x="258" y="158" width="84" height="24" rx="12"/></g>
<g font-size="11.5" font-weight="700" fill="#0f172a" text-anchor="middle"><text x="300" y="90">Dashboard</text><text x="300" y="132">Modbus TCP</text><text x="300" y="174">MQTT</text></g>
<g stroke="#38bdf8" stroke-width="2.5"><line x1="238" y1="116" x2="258" y2="88"/><line x1="238" y1="128" x2="258" y2="128"/><line x1="238" y1="140" x2="258" y2="168"/></g>
<text x="24" y="240" fill="#a9c2d7" font-size="14">RS485 vibration sensor to dashboard,</text>
<text x="24" y="262" fill="#a9c2d7" font-size="14">PLC and MQTT, with a latched alarm.</text>
</g>

<!-- 2 smart city -->
<g transform="translate(420 140)">
<use href="#panel"/>
<text x="24" y="37" fill="#f8fafc" font-size="18" font-weight="700">Smart City Demo Dashboard</text>
<path d="M20 190 L180 120 L340 190 L180 205 Z" fill="#14532d"/>
<g><path d="M70 170 v-60 l22 -10 v60 z" fill="#38bdf8"/><path d="M92 160 v-60 l18 8 v60 z" fill="#0ea5e9"/></g>
<g><path d="M120 176 v-86 l26 -12 v86 z" fill="#a78bfa"/><path d="M146 164 v-86 l20 9 v86 z" fill="#8b5cf6"/></g>
<g><path d="M190 178 v-40 l40 -14 v40 z" fill="#fbbf24"/><path d="M230 164 v-40 l30 12 v40 z" fill="#f59e0b"/></g>
<text x="225" y="196" fill="#fde68a" font-size="11" text-anchor="middle">warehouse</text>
<g transform="translate(262 66) rotate(-12)"><rect x="0" y="8" width="56" height="10" rx="5" fill="#e2e8f0"/><path d="M22 12 l-8 -16 h8 l14 16 z M22 14 l-8 16 h8 l14 -16 z" fill="#cbd5e1"/><path d="M0 12 l-6 -10 h6 l6 10z" fill="#cbd5e1"/></g>
<circle cx="102" cy="92" r="5" fill="#34d399"/><circle cx="156" cy="70" r="5" fill="#f87171"/><circle cx="214" cy="118" r="5" fill="#34d399"/>
<text x="24" y="240" fill="#a9c2d7" font-size="14">3D city, airport and warehouse with</text>
<text x="24" y="262" fill="#a9c2d7" font-size="14">sensor demos and IRIV controller tours.</text>
</g>

<!-- 3 milesight -->
<g transform="translate(800 140)">
<use href="#panel"/>
<text x="24" y="37" fill="#f8fafc" font-size="18" font-weight="700">Milesight Dashboard</text>
<g fill="#e2e8f0"><rect x="26" y="70" width="34" height="26" rx="6"/><rect x="26" y="112" width="34" height="26" rx="6"/><rect x="26" y="154" width="34" height="26" rx="6"/></g>
<g fill="#0891b2"><circle cx="36" cy="83" r="4"/><circle cx="36" cy="125" r="4"/><circle cx="36" cy="167" r="4"/></g>
<g fill="none" stroke="#7dd3fc" stroke-width="2.5" stroke-linecap="round"><path d="M66 78 q8 5 0 10 M74 74 q12 9 0 18"/><path d="M66 120 q8 5 0 10 M74 116 q12 9 0 18"/><path d="M66 162 q8 5 0 10 M74 158 q12 9 0 18"/></g>
<path d="M126 180 L140 92 L154 180 Z" fill="#64748b"/><circle cx="140" cy="88" r="7" fill="#fbbf24"/>
<text x="140" y="198" fill="#cbd5e1" font-size="11" text-anchor="middle">gateway</text>
<line x1="160" y1="128" x2="196" y2="128" stroke="#38bdf8" stroke-width="3"/>
<rect x="198" y="80" width="140" height="92" rx="10" fill="#475569"/><rect x="205" y="87" width="126" height="78" rx="6" fill="#0f172a"/>
<g fill="#334155"><rect x="211" y="93" width="54" height="30" rx="4"/><rect x="271" y="93" width="54" height="30" rx="4"/></g>
<text x="238" y="113" fill="#34d399" font-size="12" font-weight="700" text-anchor="middle">24.6°C</text><text x="298" y="113" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">62%</text>
<polyline points="212,156 230,146 248,150 266,136 284,142 302,130 322,136" fill="none" stroke="#fbbf24" stroke-width="2.5"/>
<path d="M300 64 l26 -8 l-6 22 l-6 -8z" fill="#38bdf8"/>
<text x="24" y="240" fill="#a9c2d7" font-size="14">LoRaWAN sensors with two-way MQTT,</text>
<text x="24" y="262" fill="#a9c2d7" font-size="14">Firebase storage and Telegram questions.</text>
</g>

<!-- 4 speed console -->
<g transform="translate(40 450)">
<use href="#panel"/>
<text x="24" y="37" fill="#f8fafc" font-size="18" font-weight="700">IRIV Speed Console</text>
<rect x="40" y="70" width="8" height="120" fill="#64748b"/>
<rect x="44" y="70" width="56" height="26" rx="6" fill="#e2e8f0"/><circle cx="96" cy="83" r="9" fill="#0f172a"/><circle cx="96" cy="83" r="4" fill="#38bdf8"/>
<path d="M104 80 L190 120 L190 160 Z" fill="#38bdf8" opacity=".18"/>
<rect x="20" y="184" width="320" height="10" fill="#334155"/>
