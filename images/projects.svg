<path d="M150 150 h-24 M156 162 h-36 M150 174 h-20" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/>
<rect x="216" y="60" width="122" height="54" rx="10" fill="#0f172a" stroke="#f87171" stroke-width="2"/>
<text x="277" y="84" fill="#f87171" font-size="18" font-weight="700" text-anchor="middle">72 km/h</text>
<rect x="238" y="92" width="78" height="16" rx="3" fill="#fef3c7"/><text x="277" y="104" fill="#0f172a" font-size="11" font-weight="700" text-anchor="middle">ABC 1234</text>
<text x="24" y="240" fill="#a9c2d7" font-size="14">Speed and plate records from LPR</text>
<text x="24" y="262" fill="#a9c2d7" font-size="14">cameras, with alerts queued when offline.</text>
</g>

<!-- 5 depth inspection -->
<g transform="translate(420 450)">
<use href="#panel"/>
<text x="24" y="37" fill="#f8fafc" font-size="18" font-weight="700">Depth Inspection Station</text>
<rect x="40" y="62" width="150" height="8" fill="#64748b"/><rect x="40" y="62" width="8" height="128" fill="#64748b"/>
<rect x="100" y="70" width="64" height="20" rx="6" fill="#e2e8f0"/><circle cx="118" cy="80" r="5" fill="#0f172a"/><circle cx="146" cy="80" r="5" fill="#0f172a"/>
<path d="M132 90 L96 160 L170 160 Z" fill="#a78bfa" opacity=".22"/>
<rect x="30" y="176" width="190" height="12" rx="3" fill="#475569"/>
<path d="M104 176 v-18 h56 v18 z" fill="#cbd5e1"/><circle cx="142" cy="164" r="4" fill="#f87171"/>
