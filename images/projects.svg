<rect x="252" y="90" width="72" height="18" rx="4" fill="#16a34a"/><text x="288" y="104" fill="#fff" font-size="12" font-weight="700" text-anchor="middle">PASS</text>
<rect x="252" y="112" width="72" height="18" rx="4" fill="#dc2626" opacity=".35"/><text x="288" y="126" fill="#fecaca" font-size="12" font-weight="700" text-anchor="middle">FAIL</text>
<rect x="244" y="156" width="88" height="22" rx="6" fill="#1d4ed8"/><text x="288" y="171" fill="#fff" font-size="11" font-weight="700" text-anchor="middle">Hailo AI · CM5</text>
<text x="24" y="240" fill="#a9c2d7" font-size="14">Depth camera finds dents and holes,</text>
<text x="24" y="262" fill="#a9c2d7" font-size="14">measures boxes and watches safe zones.</text>
</g>

<!-- 6 forgemodbus -->
<g transform="translate(800 450)">
<use href="#panel"/>
<text x="24" y="37" fill="#f8fafc" font-size="18" font-weight="700">ForgeModbus library</text>
<rect x="34" y="80" width="96" height="86" rx="10" fill="#1f2937" stroke="#94a3b8" stroke-width="2"/>
<g fill="#94a3b8"><rect x="26" y="92" width="8" height="5"/><rect x="26" y="106" width="8" height="5"/><rect x="26" y="120" width="8" height="5"/><rect x="26" y="134" width="8" height="5"/><rect x="26" y="148" width="8" height="5"/><rect x="130" y="92" width="8" height="5"/><rect x="130" y="106" width="8" height="5"/><rect x="130" y="120" width="8" height="5"/><rect x="130" y="134" width="8" height="5"/><rect x="130" y="148" width="8" height="5"/></g>
<text x="82" y="118" fill="#f8fafc" font-size="15" font-weight="700" text-anchor="middle">ESP32</text>
<text x="82" y="138" fill="#94a3b8" font-size="11" text-anchor="middle">Modbus TCP</text>
<text x="82" y="152" fill="#94a3b8" font-size="11" text-anchor="middle">server</text>
<path d="M146 112 h52 M198 136 h-52" stroke="#38bdf8" stroke-width="3"/>
<path d="M190 106 l10 6 l-10 6 z M154 130 l-10 6 l10 6 z" fill="#38bdf8"/>
<rect x="208" y="72" width="132" height="104" rx="8" fill="#e2e8f0"/>
<rect x="208" y="72" width="132" height="22" rx="8" fill="#94a3b8"/><rect x="208" y="86" width="132" height="8" fill="#94a3b8"/>
<text x="274" y="88" fill="#0f172a" font-size="12" font-weight="700" text-anchor="middle">PLC registers</text>
<g font-size="11.5" fill="#0f172a" font-family="Consolas,Menlo,monospace"><text x="218" y="112">40001  1234</text><text x="218" y="132">40002  0.82</text><text x="218" y="152">00001  ON</text><text x="218" y="170">30001  42</text></g>
