<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="t d">
<title id="t">Wilcoxon 883M gateway</title>
<desc id="d">A Wilcoxon 883M sensor on a motor sends X, Y and Z vibration and temperature over RS485 Modbus RTU to a gateway: a Cytron IRIV IO Controller or an ESP32 board. The gateway serves a web dashboard, answers PLCs over Modbus TCP and publishes metrics, waveforms and spectra to an MQTT broker for analytics. On the IRIV, output DO0 drives a latched alarm light and input DI1 is the acknowledge button.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#16364a"/></linearGradient>
<marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#38bdf8"/></marker>
</defs>
<rect width="1200" height="580" rx="20" fill="url(#bg)"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="48" y="52" fill="#38bdf8" font-size="15" letter-spacing="3">CURRENT FOCUS · OPEN SOURCE</text>
<text x="48" y="92" fill="#f8fafc" font-size="30" font-weight="700">Wilcoxon 883M gateway</text>
<text x="48" y="120" fill="#a9c2d7" font-size="16">One vibration sensor, three ways to use its data, and an alarm light that waits for a person.</text>

<!-- motor + sensor -->
<rect x="40" y="160" width="230" height="300" rx="16" fill="#16283e" stroke="#35516b" stroke-width="2"/>
<rect x="66" y="262" width="150" height="96" rx="16" fill="#64748b"/>
<g stroke="#475569" stroke-width="4"><line x1="88" y1="272" x2="88" y2="348"/><line x1="112" y1="272" x2="112" y2="348"/><line x1="136" y1="272" x2="136" y2="348"/><line x1="160" y1="272" x2="160" y2="348"/><line x1="184" y1="272" x2="184" y2="348"/></g>
<rect x="216" y="298" width="34" height="22" rx="4" fill="#94a3b8"/>
<rect x="80" y="358" width="122" height="14" rx="4" fill="#475569"/>
<rect x="118" y="222" width="46" height="40" rx="10" fill="#2dd4bf"/>
<circle cx="132" cy="238" r="4" fill="#0f172a"/><circle cx="150" cy="238" r="4" fill="#0f172a"/>
<path d="M132 250 Q141 256 150 250" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
<path d="M172 222 q10 -12 0 -24 M184 226 q16 -18 0 -36" fill="none" stroke="#2dd4bf" stroke-width="3" stroke-linecap="round"/>
<text x="141" y="208" fill="#99f6e4" font-size="14" font-weight="700" text-anchor="middle">883M</text>
<text x="155" y="404" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">Motor or pump</text>
<text x="155" y="426" fill="#a9c2d7" font-size="13" text-anchor="middle">X/Y/Z vibration</text>
<text x="155" y="444" fill="#a9c2d7" font-size="13" text-anchor="middle">and temperature</text>

<!-- RS485 -->
<path d="M164 232 C 260 180, 300 300, 400 300" fill="none" stroke="#fbbf24" stroke-width="5" stroke-dasharray="10 6"/>
<rect x="282" y="320" width="110" height="44" rx="10" fill="#422006"/>
<text x="337" y="338" fill="#fde68a" font-size="13" font-weight="700" text-anchor="middle">RS485</text>
<text x="337" y="356" fill="#fde68a" font-size="12" text-anchor="middle">Modbus RTU</text>

<!-- gateway -->
<rect x="400" y="200" width="220" height="190" rx="18" fill="#1e3a5f" stroke="#38bdf8" stroke-width="2"/>
<g fill="#22c55e"><rect x="414" y="212" width="16" height="10" rx="2"/><rect x="436" y="212" width="16" height="10" rx="2"/><rect x="568" y="212" width="16" height="10" rx="2"/><rect x="590" y="212" width="16" height="10" rx="2"/></g>
<rect x="450" y="236" width="120" height="84" rx="16" fill="#2563eb"/>
<circle cx="485" cy="268" r="9" fill="#fff"/><circle cx="535" cy="268" r="9" fill="#fff"/>
<circle cx="487" cy="269" r="4" fill="#0f172a"/><circle cx="537" cy="269" r="4" fill="#0f172a"/>
<path d="M480 292 Q510 312 540 292" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
<text x="510" y="350" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">Gateway</text>
<text x="510" y="372" fill="#a9c2d7" font-size="13" text-anchor="middle">IRIV IO Controller or ESP32</text>

<!-- outputs -->
<g stroke="#38bdf8" stroke-width="3" fill="none" marker-end="url(#ar)">
<path d="M620 250 C 680 250, 690 200, 744 200"/>
<path d="M620 295 L744 295"/>
<path d="M620 340 C 680 340, 690 390, 744 390"/>
</g>
<g>
<rect x="750" y="160" width="410" height="80" rx="14" fill="#16283e" stroke="#35516b" stroke-width="2"/>
<rect x="770" y="176" width="66" height="44" rx="5" fill="#475569"/><rect x="775" y="181" width="56" height="34" rx="3" fill="#0f172a"/>
<polyline points="779,207 789,197 797,203 807,189 817,199 827,187" fill="none" stroke="#34d399" stroke-width="2.5"/>
<rect x="762" y="220" width="82" height="6" rx="3" fill="#64748b"/>
<text x="860" y="194" fill="#f8fafc" font-size="16" font-weight="700">Web dashboard</text>
<text x="860" y="216" fill="#a9c2d7" font-size="13">live X/Y/Z, trends, waveform and spectrum</text>
</g>
<g>
<rect x="750" y="255" width="410" height="80" rx="14" fill="#16283e" stroke="#35516b" stroke-width="2"/>
<rect x="772" y="270" width="62" height="50" rx="6" fill="#94a3b8"/>
<g fill="#16a34a"><circle cx="784" cy="282" r="3"/><circle cx="794" cy="282" r="3"/></g>
<g fill="#334155"><rect x="780" y="292" width="8" height="20"/><rect x="792" y="292" width="8" height="20"/><rect x="804" y="292" width="8" height="20"/><rect x="816" y="292" width="8" height="20"/></g>
<text x="860" y="289" fill="#f8fafc" font-size="16" font-weight="700">PLC / SCADA</text>
<text x="860" y="311" fill="#a9c2d7" font-size="13">Modbus TCP holding registers, capture triggers</text>
</g>
<g>
<rect x="750" y="350" width="410" height="80" rx="14" fill="#16283e" stroke="#35516b" stroke-width="2"/>
<g fill="#cbd5e1"><circle cx="788" cy="394" r="14"/><circle cx="804" cy="384" r="18"/><circle cx="822" cy="395" r="13"/><rect x="778" y="392" width="56" height="16" rx="7"/></g>
<text x="860" y="384" fill="#f8fafc" font-size="16" font-weight="700">MQTT broker → analytics</text>
<text x="860" y="406" fill="#a9c2d7" font-size="13">metrics, alarms, whole waveforms in one message</text>
</g>

<!-- alarm I/O -->
<path d="M470 390 L470 470 L606 470" fill="none" stroke="#f87171" stroke-width="3" marker-end="url(#ar)"/>
<path d="M550 512 L550 390" fill="none" stroke="#a78bfa" stroke-width="3" stroke-dasharray="6 5"/>
<text x="402" y="440" fill="#fca5a5" font-size="13" font-weight="700">DO0</text>
<text x="560" y="420" fill="#c4b5fd" font-size="13" font-weight="700">DI1</text>
<g transform="translate(630 440)">
<rect x="0" y="40" width="44" height="12" rx="3" fill="#64748b"/>
<path d="M4 40 Q4 6 22 6 Q40 6 40 40 z" fill="#ef4444"/>
<path d="M-12 14 l-12 -6 M-12 28 h-14 M56 14 l12 -6 M56 28 h14" stroke="#fca5a5" stroke-width="3" stroke-linecap="round"/>
<text x="90" y="24" fill="#f8fafc" font-size="15" font-weight="700">Alarm light (latched)</text>
<text x="90" y="44" fill="#a9c2d7" font-size="13">stays on until someone acknowledges</text>
</g>
<g transform="translate(500 500)">
<rect x="30" y="4" width="40" height="30" rx="6" fill="#475569"/><circle cx="50" cy="19" r="10" fill="#22c55e"/>
<text x="-150" y="24" fill="#c4b5fd" font-size="13">Acknowledge button</text>
</g>
<text x="1160" y="548" fill="#94a3b8" font-size="12" text-anchor="end">DO0 / DI1 are IRIV IO Controller I/O</text>
</g>
</svg>
