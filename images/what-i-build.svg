<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d">
<title id="t">Turning vibration into value</title>
<desc id="d">Cartoon pipeline of the systems I build: a machine with a vibration or LoRaWAN sensor, an edge gateway such as an ESP32, IRIV IO Controller or Raspberry Pi CM5, protocols such as Modbus, MQTT and LoRaWAN, an MQTT broker and cloud storage, dashboards, and alerts that reach the maintenance team.</desc>
<defs>
<linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0f172a"/><stop offset="1" stop-color="#16364a"/></linearGradient>
<marker id="ar" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9" fill="#38bdf8"/></marker>
<rect id="card" width="170" height="250" rx="16" fill="#16283e" stroke="#35516b" stroke-width="2"/>
</defs>
<rect width="1200" height="480" rx="20" fill="url(#bg)"/>
<g font-family="Segoe UI,Arial,sans-serif">
<text x="48" y="52" fill="#38bdf8" font-size="15" letter-spacing="3">INDUSTRIAL IOT · CONDITION MONITORING</text>
<text x="48" y="92" fill="#f8fafc" font-size="30" font-weight="700">Turning vibration into value</text>
<text x="48" y="120" fill="#a9c2d7" font-size="16">From a machine's vibration to an alert a maintenance team can act on.</text>

<g stroke="#38bdf8" stroke-width="3" marker-end="url(#ar)">
<line x1="212" y1="265" x2="228" y2="265"/><line x1="402" y1="265" x2="418" y2="265"/><line x1="592" y1="265" x2="608" y2="265"/>
<line x1="782" y1="265" x2="798" y2="265"/><line x1="972" y1="265" x2="988" y2="265"/>
</g>

<!-- 1 machine -->
<g transform="translate(40 150)">
<use href="#card"/>
<rect x="28" y="62" width="96" height="62" rx="12" fill="#64748b"/>
<g stroke="#475569" stroke-width="3"><line x1="44" y1="70" x2="44" y2="116"/><line x1="60" y1="70" x2="60" y2="116"/><line x1="76" y1="70" x2="76" y2="116"/><line x1="92" y1="70" x2="92" y2="116"/></g>
<rect x="124" y="86" width="22" height="14" rx="3" fill="#94a3b8"/>
<rect x="36" y="124" width="80" height="10" rx="3" fill="#475569"/>
<rect x="62" y="40" width="30" height="22" rx="6" fill="#2dd4bf"/><circle cx="72" cy="49" r="3" fill="#0f172a"/><circle cx="82" cy="49" r="3" fill="#0f172a"/>
<path d="M100 40 q8 -10 0 -20 M110 44 q12 -14 0 -28" fill="none" stroke="#2dd4bf" stroke-width="2.5" stroke-linecap="round"/>
<text x="85" y="170" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">Machine + sensor</text>
<text x="85" y="194" fill="#a9c2d7" font-size="13" text-anchor="middle">Wilcoxon 883M, ILA</text>
<text x="85" y="214" fill="#a9c2d7" font-size="13" text-anchor="middle">Milesight LoRaWAN</text>
</g>

<!-- 2 edge -->
<g transform="translate(230 150)">
<use href="#card"/>
<line x1="85" y1="44" x2="85" y2="30" stroke="#94a3b8" stroke-width="3"/><circle cx="85" cy="26" r="6" fill="#fbbf24"/>
<rect x="40" y="44" width="90" height="80" rx="16" fill="#2563eb"/>
<circle cx="68" cy="76" r="8" fill="#fff"/><circle cx="102" cy="76" r="8" fill="#fff"/>
<circle cx="70" cy="77" r="3.5" fill="#0f172a"/><circle cx="104" cy="77" r="3.5" fill="#0f172a"/>
<path d="M66 100 Q85 114 104 100" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round"/>
<g fill="#93c5fd"><rect x="32" y="60" width="8" height="6"/><rect x="32" y="76" width="8" height="6"/><rect x="32" y="92" width="8" height="6"/><rect x="130" y="60" width="8" height="6"/><rect x="130" y="76" width="8" height="6"/><rect x="130" y="92" width="8" height="6"/></g>
<text x="85" y="170" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">Edge gateway</text>
<text x="85" y="194" fill="#a9c2d7" font-size="13" text-anchor="middle">ESP32, IRIV IO Controller</text>
<text x="85" y="214" fill="#a9c2d7" font-size="13" text-anchor="middle">Raspberry Pi CM5</text>
</g>

<!-- 3 protocols -->
<g transform="translate(420 150)">
<use href="#card"/>
<rect x="22" y="36" width="126" height="26" rx="13" fill="#f97316"/><text x="85" y="54" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">Modbus RTU/TCP</text>
<rect x="22" y="70" width="126" height="26" rx="13" fill="#7c3aed"/><text x="85" y="88" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">MQTT</text>
<rect x="22" y="104" width="126" height="26" rx="13" fill="#0891b2"/><text x="85" y="122" fill="#fff" font-size="13" font-weight="700" text-anchor="middle">LoRaWAN · BLE</text>
<text x="85" y="170" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">Protocols</text>
<text x="85" y="194" fill="#a9c2d7" font-size="13" text-anchor="middle">RS485, Ethernet, Wi-Fi</text>
<text x="85" y="214" fill="#a9c2d7" font-size="13" text-anchor="middle">secure pipelines</text>
</g>

<!-- 4 cloud -->
<g transform="translate(610 150)">
<use href="#card"/>
<g fill="#cbd5e1"><circle cx="58" cy="78" r="24"/><circle cx="86" cy="62" r="30"/><circle cx="116" cy="80" r="22"/><rect x="40" y="78" width="96" height="26" rx="10"/></g>
<text x="86" y="92" fill="#0f172a" font-size="13" font-weight="700" text-anchor="middle">broker</text>
<ellipse cx="86" cy="116" rx="26" ry="7" fill="#fbbf24"/><rect x="60" y="116" width="52" height="22" fill="#fbbf24"/><ellipse cx="86" cy="138" rx="26" ry="7" fill="#f59e0b"/>
<text x="85" y="170" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">Broker &amp; cloud</text>
<text x="85" y="194" fill="#a9c2d7" font-size="13" text-anchor="middle">MQTT, Firebase</text>
<text x="85" y="214" fill="#a9c2d7" font-size="13" text-anchor="middle">Google Cloud, InfluxDB</text>
</g>

<!-- 5 dashboards -->
<g transform="translate(800 150)">
<use href="#card"/>
<rect x="24" y="36" width="122" height="84" rx="10" fill="#475569"/><rect x="32" y="44" width="106" height="68" rx="6" fill="#0f172a"/>
<polyline points="38,96 52,84 64,90 78,66 92,76 106,58 120,70 132,52" fill="none" stroke="#34d399" stroke-width="3" stroke-linejoin="round"/>
<g fill="#38bdf8"><rect x="40" y="100" width="10" height="8"/><rect x="56" y="96" width="10" height="12"/><rect x="72" y="92" width="10" height="16"/></g>
<rect x="76" y="120" width="18" height="12" fill="#64748b"/><rect x="60" y="132" width="50" height="6" rx="3" fill="#64748b"/>
<text x="85" y="170" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">Dashboards</text>
<text x="85" y="194" fill="#a9c2d7" font-size="13" text-anchor="middle">Dash, Grafana, Streamlit</text>
<text x="85" y="214" fill="#a9c2d7" font-size="13" text-anchor="middle">custom web apps</text>
</g>

<!-- 6 alerts -->
<g transform="translate(990 150)">
<use href="#card"/>
<rect x="22" y="34" width="62" height="104" rx="12" fill="#334155" stroke="#94a3b8" stroke-width="2"/>
<rect x="28" y="50" width="50" height="40" rx="6" fill="#fef3c7"/>
<path d="M53 56 l12 22 h-24z" fill="#f59e0b"/><text x="53" y="76" fill="#451a03" font-size="12" font-weight="700" text-anchor="middle">!</text>
<path d="M40 100 l26 -8 l-6 22 l-6 -8z" fill="#38bdf8"/>
<circle cx="122" cy="88" r="26" fill="#fde68a"/>
<path d="M94 82 Q122 46 150 82 z" fill="#facc15"/><rect x="92" y="80" width="60" height="7" rx="3" fill="#eab308"/>
<circle cx="113" cy="96" r="3.5" fill="#0f172a"/><circle cx="131" cy="96" r="3.5" fill="#0f172a"/>
<path d="M112 105 Q122 114 132 105" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
<text x="85" y="170" fill="#f8fafc" font-size="16" font-weight="700" text-anchor="middle">Alerts &amp; action</text>
<text x="85" y="194" fill="#a9c2d7" font-size="13" text-anchor="middle">Telegram, reports</text>
<text x="85" y="214" fill="#a9c2d7" font-size="13" text-anchor="middle">maintenance team</text>
</g>

<text x="600" y="448" fill="#a9c2d7" font-size="15" text-anchor="middle">Live readings  →  trends and spectra  →  alarms  →  predictive maintenance</text>
</g>
</svg>
